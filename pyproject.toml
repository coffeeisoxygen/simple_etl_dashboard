[project]
name = "simple-etl-dashboard"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.3.0",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "plotly>=6.1.2",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.41",
    "stqdm>=0.0.5",
    "streamlit>=1.45.1",
    "streamlit-cookies-controller>=0.0.4",
    "streamlit-pydantic>=0.6.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.14.3",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.13",
]
[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []            # Tidak ada single modules
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools_scm]
write_to = "src/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.coverage.run]
source = ["src"]
data_file = ".reports/coverage/.coverage"
omit = [
    "*/tests/*",
    "*/_version.py",
    "*/scripts/*",
    "*/__init__.py",
    "*/site-packages/*",
    "*/.venv/*",
    "*/shibokensupport/*",
    "*/pyscript/*",
    "*/signature_bootstrap.py",
    "src/__init__.py",
    "src/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = ".reports/coverage/html"
skip_covered = false
skip_empty = true


[tool.pytest.ini_options]
generate_report_on_test = true
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--no-header",                            # 🆕 Cleaner VSCode output
    "--disable-warnings",                     # 🆕 Less noise in test explorer
    "--cov=src",
    "--cov-report=html:.reports/coverage",
    "--cov-report=term-missing:skip-covered", # 🆕 Less verbose coverage
    "--html=.reports/tests/report.html",
    "--self-contained-html",
     "--alluredir=.reports/allure" # 🆕 Allure report directory biar keren
]

# 🆕 VSCode-friendly logging (less verbose)
log_cli = false                                                       # Changed from true - less noise in test explorer
log_cli_level = "WARNING"                                             # Changed from DEBUG
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_auto_indent = true

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "config: Configuration system tests",
    "auth: Authentication system tests",                           # 🆕 For your auth tests
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


# ✅ Minimum version requirements
minversion = "8.0"

# ✅ Test discovery options
norecursedirs = [
    ".*",
    "build",
    "dist",
    "*.egg",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".reports",
]


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
lint.fixable = ["ALL"]
lint.unfixable = []

lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle (docstrings)
    "ANN", # flake8-annotations (type hints)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
]
lint.ignore = [
    "E501",   # line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "ANN204", # Missing return type annotation for special method `__init__`
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs`
    "ANN202", # Missing type annotation for `self`
    "ANN201", # Missing type annotation for `cls`
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"src/deprecated/*" = ["ALL"]
"scripts/*" = ["D100"]
"__init__.py" = ["D104"]
"_version.py" = ["D", "ANN", "E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 60
